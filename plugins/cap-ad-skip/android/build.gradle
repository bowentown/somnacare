buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

apply plugin: 'com.android.library'

def safeExt(name, fallback) {
    try {
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
    } catch (Exception e) {
        return fallback
    }
}

android {
    namespace "com.somnacare.adskip"
    compileSdk safeExt('compileSdkVersion', 35)
    defaultConfig {
        minSdkVersion safeExt('minSdkVersion', 24)
        targetSdkVersion safeExt('targetSdkVersion', 35)
        versionCode 1
        versionName "1.0"
    }
    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    // Shizuku（可选守护）：仅用于用户显式点击后把无障碍组件写回 secure settings
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
}
