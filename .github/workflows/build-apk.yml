name: Build Standalone Offline Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI 硬性要求 Node >= 22（npm 只告 EBADENGINE，
          # npx cap 运行时才硬失败——必须在这里对齐）
          node-version: 22

      - name: Locate App Source & Normalize Root
        run: |
          echo "=== 检查仓库目录结构 ==="
          ls -la
          
          # 如果 package.json 不在根目录，自动在子目录中查找并拉到根目录
          if [ ! -f "package.json" ]; then
            PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              SUB_DIR=$(dirname "$PKG_PATH")
              echo "检测到源码存放在子目录 [$SUB_DIR]，正在自动提升至根目录..."
              cp -r "$SUB_DIR"/* .
              # 复制可能存在的隐藏文件
              cp -r "$SUB_DIR"/.[!.]* . 2>/dev/null || true
            fi
          fi

          if [ ! -f "package.json" ]; then
            echo "::error::未找到 package.json！请确认您上传的代码包包含 package.json 和 src。"
            exit 1
          fi
          
          echo "源码已就绪，当前根目录结构："
          ls -la

      - name: Install Project Dependencies
        run: |
          # 使用 --legacy-peer-deps 确保无论任何 npm 版本都能 100% 成功安装
          npm install --legacy-peer-deps

      - name: Run Guardrails (wiring / theme / contrast)
        run: npm run verify
      - name: Build Local Offline Dist
        run: |
          npm run build
          ls -la dist/

      - name: Verify Generated CSS Classes
        run: npm run verify:css
      - name: Runtime smoke tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Install Capacitor CLI / Core / Android (pinned major)
        run: |
          # 三个运行时插件（local-notifications/filesystem/share）已在 package.json
          # dependencies 里随第一步装好，这里只补 cap 三件套。
          # 必须显式 pin 主版本 + --legacy-peer-deps：无锁安装会整树重解析，
          # Capacitor 出新主版本后模板漂移会让下面所有 sed 静默失配
          npm install --legacy-peer-deps --save-dev @capacitor/cli@^8 @capacitor/core@^8 @capacitor/android@^8
          # 本地原生插件：MediaPipe LLM Inference（Gemma .task 端侧推理）+ 使用行为信号
          npm install --legacy-peer-deps --save-dev ./plugins/cap-gemma-llm ./plugins/cap-usage-signal

      - name: Configure Capacitor for 100% Local Offline App
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.somnacare.sleep",
            "appName": "极光睡眠",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_moon",
                "iconColor": "#818cf8"
              }
            }
          }
          EOF

      - name: Create Native Android Project & Embed Offline Assets
        run: |
          npx cap add android
          npx cap sync android
          ls -la android/app/src/main/assets/public/

      - name: Configure Android SDK, Permissions & Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # 注入 AndroidManifest 核心闹钟与通知权限 (Android 12/13/14 必需，进程级息屏唤醒)
          # RECORD_AUDIO 供 WebView getUserMedia 做枕边环境声级采样（Capacitor 桥接运行时授权）
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\
          <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\
          <uses-permission android:name="android.permission.WAKE_LOCK" />\
          <uses-permission android:name="android.permission.RECORD_AUDIO" />\
          <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\
          <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml

          # 护眼滤镜前台服务 + 作息到点提醒 + 鲸鱼娘桌宠悬浮窗（服务/接收器，specialUse 类型 API 34+ 需属性）
          sed -i 's|</application>|<service android:name="com.somnacare.gemmallm.EyeCareService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="eye_care_overlay_filter"/></service><service android:name="com.somnacare.gemmallm.BedtimeOverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="bedtime_reminder_overlay"/></service><service android:name="com.somnacare.gemmallm.PetOverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="desktop_pet_overlay"/></service><receiver android:name="com.somnacare.gemmallm.BedtimeAlarmReceiver" android:exported="false" /><receiver android:name="com.somnacare.gemmallm.AlarmRingReceiver" android:exported="false" /><service android:name="com.somnacare.gemmallm.AlarmRingService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="alarm_ring_loop"/></service><receiver android:name="com.somnacare.gemmallm.BootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver><service android:name="com.somnacare.gemmallm.EyeCareTileService" android:label="护眼滤镜" android:permission="android.permission.BIND_QUICK_SETTINGS_TILE" android:exported="true"><intent-filter><action android:name="android.service.quicksettings.action.QS_TILE" /></intent-filter></service></application>|' android/app/src/main/AndroidManifest.xml


          # MediaPipe 要求 minSdk ≥ 24。只升不降：模板默认值将来可能高于 24，
          # 无条件 sed 会把 26 降回 24，而"== 24"断言恰好确认被降级的值
          cur_minSdk=$(grep -oE 'minSdkVersion = [0-9]+' android/variables.gradle | grep -oE '[0-9]+$' | head -1)
          if [ -z "$cur_minSdk" ] || [ "$cur_minSdk" -lt 24 ]; then
            sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          fi

          # sed 注入必须命中断言：模板结构变化导致静默不命中时，权限/服务缺失
          # 只会在运行期表现为"闹钟不响/滤镜打不开"——必须在 CI 就拦住
          grep -q 'SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'com.somnacare.gemmallm.PetOverlayService' android/app/src/main/AndroidManifest.xml
          grep -q 'com.somnacare.gemmallm.AlarmRingService' android/app/src/main/AndroidManifest.xml
          grep -q 'com.somnacare.gemmallm.BootReceiver' android/app/src/main/AndroidManifest.xml
          # 断言 ≥ 24（而非 == 24：相等断言会"确认"被降级后的值）
          grep -qE 'minSdkVersion = (2[4-9]|[3-9][0-9])' android/variables.gradle

          # 注入闹钟铃声资源（30 秒渐弱钟声，通知通道用；息屏响铃依赖它）
          # 注入启动屏（深色，消灭白屏闪现）与通知栏白色月亮小图标
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cp -r native-resources/res/raw/* android/app/src/main/res/raw/
          cp -r native-resources/res/drawable/* android/app/src/main/res/drawable/
          cp native-resources/splash.png android/app/src/main/res/drawable/splash.png
          # 品牌启动图标：全密度 + 自适应图标（前景/底色）+ 深色启动屏（含品牌图标居中）
          cp -r native-resources/mipmap-mdpi native-resources/mipmap-hdpi native-resources/mipmap-xhdpi native-resources/mipmap-xxhdpi native-resources/mipmap-xxxhdpi android/app/src/main/res/
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp native-resources/adaptive/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp native-resources/adaptive/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          # 自适应图标底色：Capacitor 模板将 ic_launcher_background 定义在独立文件或 colors.xml 中；
          # rm 只允许发生在"新建了 ic_launcher_background.xml"的分支——此前无条件 rm
          # 会把 elif 分支刚写进 colors.xml 的底色删掉，图标底色静默回退白色
          if [ -f android/app/src/main/res/values/ic_launcher_background.xml ]; then
            sed -i 's/#FFFFFF/#0B1026/' android/app/src/main/res/values/ic_launcher_background.xml
          elif [ -f android/app/src/main/res/values/colors.xml ]; then
            sed -i 's/#FFFFFF/#0B1026/' android/app/src/main/res/values/colors.xml
          else
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B1026</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
            rm -f android/app/src/main/res/values/colors.xml
          fi
          mkdir -p android/app/src/main/res/drawable-night
          cp native-resources/splash.png android/app/src/main/res/drawable-night/splash.png
          # 冷启动背景改纯深色：原生静止图不再出现，直接衔接 Web 三段式开屏动画
          python3 tools/make-cold-start-splash.py
          # 四主题启动图标（activity-alias 换图标机制）+ 各主题自适应图标 XML + 主题底色
          cp -r native-resources/themes/*/mipmap-* android/app/src/main/res/
          cp native-resources/adaptive/ic_launcher_*.xml android/app/src/main/res/mipmap-anydpi-v26/
          cat > android/app/src/main/res/values/somnacare_colors.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="somnacare_icon_bg_midnight">#060B1A</color>
              <color name="somnacare_icon_bg_pure_dark">#000000</color>
              <color name="somnacare_icon_bg_warm_amber">#1A110B</color>
              <color name="somnacare_icon_bg_serene_blue">#04141F</color>
          </resources>
          XMLEOF
          # 主入口 LAUNCHER 意图移至 4 个 activity-alias（主题换图标机制）
          python3 tools/inject-aliases.py android/app/src/main/AndroidManifest.xml

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Apply Fixed Signing Config (from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # 兜底：Secrets 未配置时保持旧的 debug 签名行为（每次构建签名不同，
            # 覆盖安装需先卸载）。配置 Secrets 后本分支自动切换为固定签名 release
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，回退 debug 签名（更新需卸载重装）"
            echo "SIGN_VARIANT=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/somnacare-release.keystore
          # 签名配置片段入仓可审阅：android{} 块在 Gradle 中可合并
          cat tools/android-signing.gradle >> android/app/build.gradle
          # versionCode = CI 运行号：单调递增，覆盖安装永不拒装
          sed -i.bak -E "s/versionCode +[0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          echo "SIGN_VARIANT=release" >> "$GITHUB_ENV"

      - name: Compile Standalone Offline APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/somnacare-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "$SIGN_VARIANT" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload Standalone Offline APK
        uses: actions/upload-artifact@v4
        with:
          name: SomnaCare-Offline-Local-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 打 v* 标签时：把构建产物发布到公开的 GitHub Release（无需登录即可下载）
  release-apk:
    name: Publish Release APK
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: SomnaCare-Offline-Local-APK
          path: apk/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK_FILE=$(find apk -name "*.apk" | head -n 1)
          RELEASE_NAME="SomnaCare-${TAG}.apk"
          cp "$APK_FILE" "$RELEASE_NAME"
          cat > release_notes.md <<'EOF'
          ## 极光睡眠 SomnaCare

          **懂睡眠，更懂你。** 100% 离线优先的 Android 睡眠记录与分析应用。

          ### 📱 安装
          1. 下载下方 Assets 中的 `.apk` 文件
          2. 手机上直接点开安装（需允许"安装未知来源应用"）
          3. 从旧版本升级：直接覆盖安装即可，睡眠数据、图鉴进度全部保留
             （仅从早期"每次签名不同"的版本升级时需先卸载一次）

          ### ✨ 功能
          - 🌙 睡眠记录 + 床头实时声级监测（纯本地计算）
          - 📊 趋势图表与 90 分钟睡眠周期推演（模型估算值，非医疗诊断）
          - ✨ AI 睡眠顾问（DeepSeek / 端侧 Gemma / 纯离线规则引擎）
          - 👁 全局护眼滤镜（暖色减蓝 + 减光，四场景 + 自定义色，定时开关）
          - ⚙️ 四套主题（桌面图标联动换色）+ 原生精确闹钟 + 数据备份

          ### 🔒 隐私
          所有睡眠数据仅存本机；AI 云端功能需自备 API Key。详情见项目 README。
          EOF
          gh release create "$TAG" "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "极光睡眠 SomnaCare $TAG" \
            --notes-file release_notes.md
