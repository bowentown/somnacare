name: Build Standalone Offline Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 顶层只读（第 135 轮收紧）：构建 job 执行 npm ci / 第三方规则拉取 / Gradle
# 等大量外部输入，不应持有写仓库权限；发布 Release 的写权限只授予 release-apk
permissions:
  contents: read

# 推 main 后紧跟推 tag 会触发两个构建，前一个白跑 ~8 分钟；
# 并发组按 ref 分组：同分支/同标签的新运行取消旧的（单人仓库），但
# main 与 v* 标签【永不互杀】——固定组名时"main+tag 同时推送"谁后启动
# 谁被取消是竞态，v1.11.2 曾因此取消了 tag run、Release 静默没发
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Capacitor 8 CLI 硬性要求 Node >= 22（npm 只告 EBADENGINE，
          # npx cap 运行时才硬失败——必须在这里对齐）
          node-version: 22

      - name: Locate App Source & Normalize Root
        run: |
          echo "=== 检查仓库目录结构 ==="
          ls -la
          
          # 如果 package.json 不在根目录，自动在子目录中查找并拉到根目录
          if [ ! -f "package.json" ]; then
            PKG_PATH=$(find . -maxdepth 3 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              SUB_DIR=$(dirname "$PKG_PATH")
              echo "检测到源码存放在子目录 [$SUB_DIR]，正在自动提升至根目录..."
              cp -r "$SUB_DIR"/* .
              # 复制可能存在的隐藏文件
              cp -r "$SUB_DIR"/.[!.]* . 2>/dev/null || true
            fi
          fi

          if [ ! -f "package.json" ]; then
            echo "::error::未找到 package.json！请确认您上传的代码包包含 package.json 和 src。"
            exit 1
          fi
          
          echo "源码已就绪，当前根目录结构："
          ls -la

      - name: Install Project Dependencies
        run: |
          # 安全审计 A10：优先 npm ci——按 package-lock.json 精确解析，
          # 防供应链版本漂移；锁文件与 package.json 失同步时回退 npm install，
          # 构建不静默中断（回退会留下明显日志）
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # 第 74 轮：构建期自动刷新 GKD 广告规则到订阅最新版。
      # 失败不阻塞发版：回退仓库已提交版本，规则可以旧，构建不能挂
      - name: Refresh GKD ad-skip rules (best-effort)
        run: |
          if npx tsx tools/refresh-gkd-rules.mts \
            && npx tsx tools/verify-ad-skip.mts > /dev/null 2>&1; then
            echo "规则已刷新到订阅最新版并通过安全审计"
          else
            echo "::warning::GKD 规则刷新失败或未通过审计，回退仓库已提交版本"
            git checkout -- plugins/cap-ad-skip/android/src/main/assets/ad_skip_rules.json || true
          fi

      # 第 91 轮：类型检查此前不在 CI 里——vite build 走 esbuild 只剥类型不查
      # 类型，TS 错误会一路走到 gradle 才炸（且报错点远离源头）。放在构建前，
      # 失败即停，省掉后面全部步骤。
      - name: Type check (tsc --noEmit)
        run: npm run lint
      - name: Run unit tests (Vitest)
        run: npm test
      - name: Run static & security guardrails
        run: npm run verify
      - name: Build Local Offline Dist
        run: |
          npm run build
          ls -la dist/

      - name: Verify Generated CSS Classes
        run: npm run verify:css
      - name: Runtime smoke tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Install Capacitor CLI / Core / Android (pinned major)
        run: |
          # 三个运行时插件（local-notifications/filesystem/share）已在 package.json
          # dependencies 里随第一步装好，这里只补 cap 三件套。
          # 必须显式 pin 版本 + --legacy-peer-deps：无锁安装会整树重解析，
          # Capacitor 出新版本后模板漂移会让下面所有 sed 静默失配
          # （A10：^8 收成精确版本，升级一律走显式提交而非 CI 静默漂移）
          npm install --legacy-peer-deps --save-dev @capacitor/cli@8.5.2 @capacitor/core@8.5.2 @capacitor/android@8.5.2
          # 6 个领域化本地原生插件（按领域解耦，各自独立管理 Manifest 与 Gradle 依赖）
          npm install --legacy-peer-deps --save-dev \
            ./plugins/cap-sleep-core \
            ./plugins/cap-sleep-widgets \
            ./plugins/cap-eye-care \
            ./plugins/cap-pet-overlay \
            ./plugins/cap-ad-skip \
            ./plugins/cap-usage-signal

      - name: Configure Capacitor for 100% Local Offline App
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.somnacare.sleep",
            "appName": "极光睡眠",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_moon",
                "iconColor": "#818cf8"
              }
            }
          }
          EOF

      - name: Create Native Android Project & Embed Offline Assets
        run: |
          npx cap add android
          npx cap sync android
          ls -la android/app/src/main/assets/public/

      - name: Configure Android SDK, Permissions & Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          # Phase 3：所有插件权限、服务与接收器均由各自插件 AndroidManifest.xml 声明并由
          # AGP Manifest Merger 自动合并；宿主级修补统一收口到可单测的 patch-android-host.mts
          npx tsx tools/patch-android-host.mts android

          # 配对落地断言（验证宿主安全加固 + 各插件清单与规则资产在场）
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'androidx.core.content.FileProvider' android/app/src/main/AndroidManifest.xml
          grep -q 'somnacare_updates' android/app/src/main/res/xml/file_paths.xml
          grep -qE 'minSdkVersion = (2[4-9]|[3-9][0-9])' android/variables.gradle
          grep -q 'SCHEDULE_EXACT_ALARM' plugins/cap-sleep-core/android/src/main/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' plugins/cap-sleep-core/android/src/main/AndroidManifest.xml
          grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' plugins/cap-sleep-core/android/src/main/AndroidManifest.xml
          grep -q 'com.somnacare.gemmallm.AlarmRingService' plugins/cap-sleep-core/android/src/main/AndroidManifest.xml
          grep -q 'com.somnacare.gemmallm.BootReceiver' plugins/cap-sleep-core/android/src/main/AndroidManifest.xml
          grep -q 'com.somnacare.gemmallm.PetOverlayService' plugins/cap-pet-overlay/android/src/main/AndroidManifest.xml
          grep -q 'com.somnacare.gemmallm.AdSkipService' plugins/cap-ad-skip/android/src/main/AndroidManifest.xml
          grep -q 'rikka.shizuku.ShizukuProvider' plugins/cap-ad-skip/android/src/main/AndroidManifest.xml
          grep -q 'QUERY_ALL_PACKAGES' plugins/cap-usage-signal/android/src/main/AndroidManifest.xml
          # 开屏规则表必须随 cap-ad-skip assets 打进 APK；缺失时服务会静默退回通用规则
          test -s plugins/cap-ad-skip/android/src/main/assets/ad_skip_rules.json
          grep -q 'GKD_subscription' plugins/cap-ad-skip/android/src/main/assets/ad_skip_rules.json

          # 注入闹钟铃声资源（30 秒渐弱钟声，通知通道用；息屏响铃依赖它）
          # 注入启动屏（深色，消灭白屏闪现）与通知栏白色月亮小图标
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cp -r native-resources/res/raw/* android/app/src/main/res/raw/
          cp -r native-resources/res/drawable/* android/app/src/main/res/drawable/
          cp native-resources/splash.png android/app/src/main/res/drawable/splash.png
          # 品牌启动图标：全密度 + 自适应图标（前景/底色）+ 深色启动屏（含品牌图标居中）
          cp -r native-resources/mipmap-mdpi native-resources/mipmap-hdpi native-resources/mipmap-xhdpi native-resources/mipmap-xxhdpi native-resources/mipmap-xxxhdpi android/app/src/main/res/
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp native-resources/adaptive/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp native-resources/adaptive/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          # 自适应图标底色：Capacitor 模板将 ic_launcher_background 定义在独立文件或 colors.xml 中；
          # rm 只允许发生在"新建了 ic_launcher_background.xml"的分支——此前无条件 rm
          # 会把 elif 分支刚写进 colors.xml 的底色删掉，图标底色静默回退白色
          if [ -f android/app/src/main/res/values/ic_launcher_background.xml ]; then
            sed -i 's/#FFFFFF/#0B1026/' android/app/src/main/res/values/ic_launcher_background.xml
          elif [ -f android/app/src/main/res/values/colors.xml ]; then
            sed -i 's/#FFFFFF/#0B1026/' android/app/src/main/res/values/colors.xml
          else
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0B1026</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
            rm -f android/app/src/main/res/values/colors.xml
          fi
          mkdir -p android/app/src/main/res/drawable-night
          cp native-resources/splash.png android/app/src/main/res/drawable-night/splash.png
          # 冷启动背景改纯深色：原生静止图不再出现，直接衔接 Web 三段式开屏动画
          python3 tools/make-cold-start-splash.py
          # 四主题启动图标（activity-alias 换图标机制）+ 各主题自适应图标 XML + 主题底色
          cp -r native-resources/themes/*/mipmap-* android/app/src/main/res/
          cp native-resources/adaptive/ic_launcher_*.xml android/app/src/main/res/mipmap-anydpi-v26/
          cat > android/app/src/main/res/values/somnacare_colors.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="somnacare_icon_bg_midnight">#060B1A</color>
              <color name="somnacare_icon_bg_pure_dark">#000000</color>
              <color name="somnacare_icon_bg_warm_amber">#1A110B</color>
              <color name="somnacare_icon_bg_serene_blue">#04141F</color>
          </resources>
          XMLEOF
          # 主入口 LAUNCHER 意图移至 4 个 activity-alias（主题换图标机制）
          python3 tools/inject-aliases.py android/app/src/main/AndroidManifest.xml

      - name: Pre-compile All 6 Native Plugin Modules (Fast Fail)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew \
            :cap-sleep-core:compileDebugJavaWithJavac \
            :cap-sleep-widgets:compileDebugJavaWithJavac \
            :cap-eye-care:compileDebugJavaWithJavac \
            :cap-pet-overlay:compileDebugJavaWithJavac \
            :cap-ad-skip:compileDebugJavaWithJavac \
            :cap-usage-signal:compileDebugJavaWithJavac \
            --no-daemon

      - name: Apply Fixed Signing Config (from GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            # 安全审计 A1：debug 变体 debuggable=true（run-as 可读应用私有数据）
            # 且每次签名不同，绝不允许以正式版本号出现在公开 Release 页面——
            # 发布标签下缺 Secrets 必须硬失败；只有分支/手动构建才允许回退 debug
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "::error::发布标签 $GITHUB_REF 必须先配置 ANDROID_KEYSTORE_BASE64（及 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD），拒绝回退 debug 签名"
              exit 1
            fi
            # 兜底：Secrets 未配置时保持旧的 debug 签名行为（每次构建签名不同，
            # 覆盖安装需先卸载）。配置 Secrets 后本分支自动切换为固定签名 release
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，回退 debug 签名（更新需卸载重装）"
            echo "SIGN_VARIANT=debug" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/somnacare-release.keystore
          # 签名配置片段入仓可审阅：android{} 块在 Gradle 中可合并
          cat tools/android-signing.gradle >> android/app/build.gradle
          # versionCode = CI 运行号：单调递增，覆盖安装永不拒装
          sed -i.bak -E "s/versionCode +[0-9]+/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          echo "SIGN_VARIANT=release" >> "$GITHUB_ENV"

      - name: Compile Standalone Offline APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/android/app/somnacare-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # versionName 跟随发布标签：tag v1.1.0 → APK 设置页显示 1.1.0，
          # 避免"Release 叫 v1.1.0、系统版本号还是 1.0.0"的错位。
          # 模板格式为 versionName "1.0.0"——sed 必须命中，否则 CI 直接失败
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            sed -i.bak -E "s/versionName \"[0-9.]+\"/versionName \"${VER}\"/" android/app/build.gradle
            grep -q "versionName \"${VER}\"" android/app/build.gradle
            echo "versionName stamped → ${VER}"
          fi
          cd android
          chmod +x gradlew
          if [ "$SIGN_VARIANT" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
          APK_FILE=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          [ -n "$APK_FILE" ] || { echo "::error::未找到 APK 产物"; exit 1; }
          unzip -l "$APK_FILE" | grep -q 'assets/ad_skip_rules.json' || {
            echo "::error::APK 内缺少开屏规则表 assets/ad_skip_rules.json"; exit 1;
          }

      - name: Upload Standalone Offline APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SomnaCare-Offline-Local-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 打 v* 标签时：把构建产物发布到公开的 GitHub Release（无需登录即可下载）
  release-apk:
    name: Publish Release APK
    needs: build-apk
    # 只有发 Release 的 job 需要写权限（创建 Release 与上传资产）
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SomnaCare-Offline-Local-APK
          path: apk/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # 安全审计 A1（纵深）：公开 Release 只接受 release 变体——
          # 上游签名步骤万一回退 debug，这里必须硬失败而不是把 debuggable
          # 的 APK 改名发布出去
          APK_FILE=$(find apk -path "*apk/release/*.apk" | head -n 1)
          [ -n "$APK_FILE" ] || { echo "::error::未找到 release 变体 APK——debug 变体禁止发布到公开 Release"; exit 1; }
          RELEASE_NAME="SomnaCare-${TAG}.apk"
          cp "$APK_FILE" "$RELEASE_NAME"
          cat > release_notes.md <<'EOF'
          ## 极光睡眠 SomnaCare

          **懂睡眠，更懂你。** 100% 离线优先的 Android 睡眠记录与分析应用。

          ### 📱 安装
          1. 下载下方 Assets 中的 `.apk` 文件
          2. 手机上直接点开安装（需允许"安装未知来源应用"）
          3. 从旧版本升级：直接覆盖安装即可，睡眠数据、图鉴进度全部保留
             （仅从早期"每次签名不同"的版本升级时需先卸载一次）

          ### ✨ 功能
          - 🌙 睡眠记录 + 床头实时声级监测（纯本地计算）
          - 📊 趋势图表与 90 分钟睡眠周期推演（模型估算值，非医疗诊断）
          - ✨ AI 睡眠顾问（DeepSeek / 自建 OpenAI 兼容接口 / 纯离线规则引擎）
          - 👁 全局护眼滤镜（暖色减蓝 + 减光，四场景 + 自定义色，定时开关）
          - 🔄 应用内更新（偏好页显式检查 GitHub Release；下载后校验签名/包名/版本）
          - ⚙️ 四套主题（桌面图标联动换色）+ 原生精确闹钟 + 数据备份

          ### 🔒 隐私
          所有睡眠数据仅存本机；AI 云端功能需自备 API Key。详情见项目 README。
          EOF
          gh release create "$TAG" "$RELEASE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "极光睡眠 SomnaCare $TAG" \
            --notes-file release_notes.md
